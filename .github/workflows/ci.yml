name: Agrivia Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop, modification ]
  pull_request:
    branches: [ main, develop, modification ]

jobs:
  build-and-verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --prefer-offline

      - name: Run Production Build
        run: yarn build
        env:
          CI: false
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://api.agrivia.uz' }}

      - name: Run Unit Tests
        run: yarn test --watchAll=false
        env:
          CI: true

