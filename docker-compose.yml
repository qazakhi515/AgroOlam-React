version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroolam-web
    restart: always
    ports:
      - "127.0.0.1:4008:80"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agroplant-ai-service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/weights:/app/weights

