version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agroplant-backend
    restart: always
    environment:
      - PORT=3006
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL}
      - SESSION_SECRET=${SESSION_SECRET:-agroplant_production_key_2026}
    volumes:
      - agro_uploads:/app/uploads
    ports:
      - "3006:3006"
    networks:
      - agro-net

  frontend:
    build:
      context: ../AgroPlant-React
      dockerfile: Dockerfile
    container_name: agroplant-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - agro-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agroplant-ai-service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service/weights:/app/weights
    networks:
      - agro-net

networks:
  agro-net:
    driver: bridge

volumes:
  agro_uploads:
    driver: local
